    <div class="main">
      <header class="topbar">
        <button id="shell-menu" class="icon-button menu-button" type="button" aria-label="Open navigation"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
        <div class="topbar-title">
          <h1 id="shell-title">Mariana Studio</h1>
          <p id="shell-subtitle"></p>
        </div>
        <div class="topbar-actions">
          <button id="shell-command" class="command-button" type="button" aria-label="Search and commands"><svg class="icon small" aria-hidden="true"><use href="#i-search"/></svg><span>Search or jump to…</span><kbd id="shell-command-key">Ctrl K</kbd></button>
          <button id="jobs-button" class="icon-button jobs-button" type="button" aria-label="Jobs" aria-haspopup="dialog" aria-expanded="false" title="Jobs"><svg class="icon" aria-hidden="true"><use href="#i-jobs"/></svg><span id="jobs-count" class="jobs-count hidden">0</span></button>
          <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch colour theme" title="Switch colour theme"><svg class="icon" aria-hidden="true"><use id="theme-icon" href="#i-sun"/></svg></button>
        </div>
      </header>

      <main id="main" class="content" tabindex="-1" aria-labelledby="shell-title">

  <div id="jobs-popover" class="popover jobs-popover hidden" role="dialog" aria-label="Jobs">
    <header>
      <h3>Jobs</h3>
      <button id="jobs-clear" class="button small ghost" type="button">Clear finished</button>
    </header>
    <div id="jobs-list"></div>
  </div>

  <section id="dependencies-panel" class="install-panel hidden" aria-label="Python dependency installer">
    <div class="install-head">
      <div class="install-mark" aria-hidden="true"><svg class="icon"><use href="#i-download"/></svg></div>
      <div class="grow">
        <h2 id="dependencies-title">Installing dependencies</h2>
        <p id="dependencies-subtitle" class="muted small"></p>
      </div>
      <button id="dependencies-close" class="icon-button" type="button" aria-label="Hide dependency installer"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div id="dependencies-groups" class="install-groups" aria-label="Requirement groups"></div>
    <div id="dependencies-progress" class="install-progress" role="progressbar" aria-label="Dependency installation progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="dependencies-bar" class="install-progress-fill"></div>
    </div>
    <div class="row between">
      <span id="dependencies-stage" class="muted small" aria-live="polite"></span>
      <span id="dependencies-percent" class="muted small numeric"></span>
    </div>
    <div id="dependencies-actions" class="row wrap"></div>
  </section>

  <section id="update-panel" class="install-panel update-panel hidden" aria-label="Mariana update">
    <div class="install-head">
      <div class="install-mark" aria-hidden="true"><svg class="icon"><use href="#i-download"/></svg></div>
      <div class="grow">
        <h2 id="update-title">Update Mariana Studio</h2>
        <p id="update-subtitle" class="muted small"></p>
      </div>
      <button id="update-close" class="icon-button" type="button" aria-label="Hide update panel"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div id="update-versions" class="update-versions" aria-label="Versions"></div>
    <p id="update-notes" class="update-notes muted small hidden"></p>
    <div id="update-progress" class="install-progress" role="progressbar" aria-label="Update progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="update-bar" class="install-progress-fill"></div>
    </div>
    <div class="row between">
      <span id="update-stage" class="muted small" aria-live="polite"></span>
      <span id="update-percent" class="muted small numeric"></span>
    </div>
    <div id="update-actions" class="row wrap"></div>
  </section>

  <dialog id="palette" class="palette" aria-label="Command palette">
    <div class="palette-input">
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="palette-input" type="text" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list" placeholder="Search workspaces, models, agents and actions…" autocomplete="off" spellcheck="false">
    </div>
    <div id="palette-list" class="palette-list" role="listbox" aria-label="Results"></div>
    <div id="palette-status" class="sr-only" role="status" aria-live="polite"></div>
    <div class="palette-footer" aria-hidden="true">
      <span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
      <span><kbd>Enter</kbd> Open</span>
      <span><kbd>Esc</kbd> Close</span>
    </div>
  </dialog>

  <dialog id="confirm-dialog" class="dialog narrow" aria-labelledby="confirm-title">
    <div class="dialog-header">
      <div><h2 id="confirm-title">Are you sure?</h2></div>
    </div>
    <div class="dialog-body">
      <p id="confirm-message"></p>
      <label id="confirm-field" class="field hidden">
        <span id="confirm-label"></span>
        <input id="confirm-input" type="text" autocomplete="off" spellcheck="false">
        <textarea id="confirm-textarea" rows="5" class="hidden" spellcheck="false"></textarea>
      </label>
    </div>
    <div class="dialog-footer">
      <button id="confirm-cancel" class="button" type="button">Cancel</button>
      <button id="confirm-accept" class="button primary" type="button">Confirm</button>
    </div>
  </dialog>

  <dialog id="picker-dialog" class="dialog" aria-labelledby="picker-title">
    <div class="dialog-header">
      <div>
        <h2 id="picker-title">Choose a folder</h2>
        <p id="picker-hint"></p>
      </div>
      <button id="picker-close" class="icon-button" type="button" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="dialog-body">
      <div class="picker-path">
        <button id="picker-up" class="icon-button" type="button" aria-label="Parent folder" title="Parent folder"><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
        <input id="picker-path" type="text" aria-label="Path" spellcheck="false" autocomplete="off">
        <button id="picker-go" class="button" type="button">Go</button>
      </div>
      <div class="row wrap">
        <button id="picker-home" class="button small ghost" type="button">Home</button>
        <button id="picker-workspace" class="button small ghost" type="button">Workspace</button>
      </div>
      <div id="picker-list" class="picker-list" role="listbox" aria-label="Folders"></div>
    </div>
    <div class="dialog-footer">
      <span id="picker-selection" class="muted small spacer truncate"></span>
      <button id="picker-cancel" class="button" type="button">Cancel</button>
      <button id="picker-accept" class="button primary" type="button">Use this folder</button>
    </div>
  </dialog>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
